[project]
name = "careroute"
version = "0.1.0"
description = "Clinical Intake, Medication Safety & Care Transition AI Copilot"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CareRoute Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "google-genai>=0.1.1",
    "google-cloud-firestore>=2.16.0",
    "google-cloud-secret-manager>=2.18.0",
    "opentelemetry-api>=1.24.0",
    "opentelemetry-sdk>=1.24.0",
    "structlog>=24.1.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.1",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
careroute = "careroute.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "evals"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

